# ACE Pro + KTC-Easy + StealthChanger
# Example macro set
# Assumes TOOL number == ACE slot number

[gcode_macro _ACE_SET_ACTIVE_LANE]
gcode:
    {% set tool = params.TOOL|int %}
    { action_respond_info("ACE lane set for tool %d" % tool) }

[gcode_macro _TOOL_PREHEAT_FOR_LOAD]
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    M109 S{temp}

[gcode_macro _TOOL_PREHEAT_FOR_UNLOAD]
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    M109 S{temp}

[gcode_macro _TOOL_EXTRUDER_UNLOAD]
gcode:
    SAVE_GCODE_STATE NAME=tool_unload_state
    M83
    G92 E0
    G1 E5 F300
    G1 E-35 F1800
    RESTORE_GCODE_STATE NAME=tool_unload_state

[gcode_macro _TOOL_EXTRUDER_LOAD]
gcode:
    SAVE_GCODE_STATE NAME=tool_load_state
    M83
    G92 E0
    G1 E25 F300
    G1 E15 F120
    RESTORE_GCODE_STATE NAME=tool_load_state

[gcode_macro _ACE_UNLOAD_FROM_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% set length = params.LENGTH|default(550)|int %}
    _ACE_SET_ACTIVE_LANE TOOL={tool}
    ACE_RETRACT INDEX={tool} LENGTH={length}

[gcode_macro _ACE_LOAD_TO_TOOL_ENTRY]
gcode:
    {% set tool = params.TOOL|int %}
    {% set length = params.LENGTH|default(550)|int %}
    _ACE_SET_ACTIVE_LANE TOOL={tool}
    ACE_FEED INDEX={tool} LENGTH={length}

[gcode_macro UNLOAD_FILAMENT]
description: ACE-aware unload for the requested tool
variable_default_tool: 0
gcode:
    {% set tool = params.TOOL|default(printer["gcode_macro UNLOAD_FILAMENT"].default_tool)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    SELECT_TOOL T={tool}
    _TOOL_PREHEAT_FOR_UNLOAD TEMP={temp}
    _TOOL_EXTRUDER_UNLOAD TOOL={tool}
    _ACE_UNLOAD_FROM_TOOL TOOL={tool}
    { action_respond_info("Unload complete for tool %d. Remove old filament from ACE slot %d." % (tool, tool)) }

[gcode_macro LOAD_FILAMENT]
description: ACE-aware load for the requested tool
variable_default_tool: 0
gcode:
    {% set tool = params.TOOL|default(printer["gcode_macro LOAD_FILAMENT"].default_tool)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    SELECT_TOOL T={tool}
    _TOOL_PREHEAT_FOR_LOAD TEMP={temp}
    _ACE_LOAD_TO_TOOL_ENTRY TOOL={tool}
    _TOOL_EXTRUDER_LOAD TOOL={tool}
    { action_respond_info("Load complete for tool %d." % tool) }

[gcode_macro CHANGE_MATERIAL]
description: Guided material swap for one tool
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    UNLOAD_FILAMENT TOOL={tool} TEMP={temp}
    PAUSE
    { action_respond_info("Install new spool in ACE slot %d, insert filament until ACE grabs it, then run LOAD_FILAMENT TOOL=%d TEMP=%d" % (tool, tool, temp)) }
