# Example ACE Pro config for Klipper
# Adjust for your printer and ACE driver version.

[save_variables]
filename: ~/printer_data/config/ace_vars.cfg

[respond]

[ace]
serial: /dev/serial/by-id/usb-ANYCUBIC_ACE_0-if00
baud: 115200
feed_speed: 50
retract_speed: 50
toolchange_retract_length: 450
max_dryer_temperature: 55
